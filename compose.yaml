services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vendas
      POSTGRES_USER: vendas
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vendas}
    ports:
      - "5432:5432"
    volumes:
      - banco:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendas -d vendas"]
      interval: 5s
      timeout: 5s
      retries: 15
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/vendas
      DB_USER: vendas
      DB_PASSWORD: ${DB_PASSWORD:-vendas}
      UPLOAD_DIR: /usr/local/tomcat/uploads
    ports:
      - "8080:8080"
    volumes:
      - imagens:/usr/local/tomcat/uploads
volumes:
  banco:
  imagens:
