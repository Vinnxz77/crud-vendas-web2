<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:p="http://primefaces.org/ui" template="/WEB-INF/template.xhtml"><ui:define name="titulo">Categorias</ui:define><ui:define name="conteudo"><h1>Categorias</h1><p class="subtitulo">Cadastre, edite e consulte seu catálogo.</p><h:form id="form" enctype="multipart/form-data"><p:growl id="mensagens" showDetail="true"/><p:messages><p:autoUpdate/></p:messages><h:panelGroup id="cadastro" layout="block" styleClass="painel"><h2><h:outputText value="#{empty categoriaController.editando.id ? 'Novo cadastro' : 'Editar registro'}"/></h2><div class="formulario"><div class="campo"><label>Nome *</label><p:inputText id="nome" value="#{categoriaController.editando.nome}" required="true" requiredMessage="Informe o nome." maxlength="100"/></div><div class="campo"><label>Categoria pai (opcional)</label><p:selectOneMenu value="#{categoriaController.editando.categoriaPai}" converter="categoriaConverter" filter="true" filterMatchMode="contains"><f:selectItem itemLabel="Categoria raiz" itemValue="#{null}" noSelectionOption="true"/><f:selectItems value="#{categoriaController.pais}" var="c" itemValue="#{c}" itemLabel="#{c.rotulo}"/></p:selectOneMenu></div></div><div class="acoes"><p:commandButton value="Salvar" icon="pi pi-check" action="#{categoriaController.salvar}" process=":form:cadastro" update=":form:cadastro :form:tabela :form:mensagens"/><p:commandButton value="Novo / cancelar" styleClass="ui-button-secondary" action="#{categoriaController.novo}" process="@this" update=":form:cadastro" resetValues="true"/></div></h:panelGroup><div class="painel"><p:commandButton value="Atualizar lista" icon="pi pi-refresh" action="#{categoriaController.atualizar}" process="@this" update=":form:tabela :form:mensagens"/><p:dataTable id="tabela" value="#{categoriaController.lista}" var="item" rowKey="#{item.id}" paginator="true" rows="10" rowsPerPageTemplate="5,10,20" paginatorPosition="bottom" emptyMessage="Nenhum registro encontrado."><p:column headerText="ID" sortBy="#{item.id}"><h:outputText value="#{item.id}"/></p:column><p:column headerText="Nome" sortBy="#{item.nome}" filterBy="#{item.nome}" filterMatchMode="contains"><h:outputText value="#{item.nome}"/></p:column><p:column headerText="Caminho hierárquico" sortBy="#{item.caminho}" filterBy="#{item.caminho}" filterMatchMode="contains"><h:outputText value="#{item.caminho}"/></p:column><p:column headerText="Ações"><p:commandButton value="Editar" icon="pi pi-pencil" action="#{categoriaController.editar(item)}" process="@this" update=":form:cadastro" resetValues="true"/><p:commandButton value="Excluir" icon="pi pi-trash" styleClass="ui-button-danger" action="#{categoriaController.excluir(item)}" process="@this" update=":form:tabela :form:mensagens"><p:confirm header="Confirmar exclusão" message="Deseja excluir este registro?" icon="pi pi-exclamation-triangle"/></p:commandButton></p:column></p:dataTable></div></h:form></ui:define></ui:composition>
