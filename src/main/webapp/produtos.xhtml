<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:p="http://primefaces.org/ui" template="/WEB-INF/template.xhtml"><ui:define name="titulo">Produtos</ui:define><ui:define name="conteudo"><h1>Produtos</h1><p class="subtitulo">Cadastre, edite e consulte seu catálogo.</p><h:form id="form" enctype="multipart/form-data"><p:growl id="mensagens" showDetail="true"/><p:messages><p:autoUpdate/></p:messages><h:panelGroup id="cadastro" layout="block" styleClass="painel"><h2><h:outputText value="#{empty produtoController.editando.id ? 'Novo cadastro' : 'Editar registro'}"/></h2><div class="formulario"><div class="campo"><label>Nome *</label><p:inputText id="nome" value="#{produtoController.editando.nome}" required="true" requiredMessage="Informe o nome." maxlength="150"/></div><div class="campo"><label>Preço (R$) *</label><p:inputNumber id="preco" value="#{produtoController.editando.preco}" decimalPlaces="2" decimalSeparator="," thousandSeparator="." minValue="0.01" maxValue="9999999999.99" required="true" requiredMessage="Informe o preço."/></div><div class="campo"><label>Quantidade em estoque *</label><p:inputNumber id="estoque" value="#{produtoController.editando.quantidadeEstoque}" decimalPlaces="0" minValue="0" maxValue="2147483647" required="true"/></div><div class="campo"><label>Marca *</label><p:selectOneMenu value="#{produtoController.editando.marca}" converter="marcaConverter" required="true" requiredMessage="Selecione a marca." filter="true" filterMatchMode="contains"><f:selectItem itemLabel="Selecione" itemValue="#{null}" noSelectionOption="true"/><f:selectItems value="#{produtoController.marcas}" var="op" itemValue="#{op}" itemLabel="#{op.nome}"/></p:selectOneMenu></div><div class="campo"><label>Categoria *</label><p:selectOneMenu value="#{produtoController.editando.categoria}" converter="categoriaConverter" required="true" requiredMessage="Selecione a categoria." filter="true" filterMatchMode="contains"><f:selectItem itemLabel="Selecione" itemValue="#{null}" noSelectionOption="true"/><f:selectItems value="#{produtoController.categorias}" var="op" itemValue="#{op}" itemLabel="#{op.rotulo}"/></p:selectOneMenu></div><div class="campo"><label>Descrição</label><p:inputTextarea value="#{produtoController.editando.descricao}" rows="3"/></div><div class="campo larga"><label>Imagem (JPG, PNG ou WEBP; até 2 MB)</label><p:fileUpload mode="advanced" auto="true" multiple="false" listener="#{produtoController.upload}" process="@this" update=":form:preview :form:mensagens" label="Escolher imagem"><p:validateFile sizeLimit="2097152" allowTypes="/(\.|\/)(jpe?g|png|webp)$/"/></p:fileUpload><h:panelGroup id="preview"><p:graphicImage value="#{produtoController.preview}" rendered="#{not empty produtoController.preview}" styleClass="preview"/><p:graphicImage value="#{request.contextPath}/imagens/#{produtoController.editando.caminhoImagem}" rendered="#{empty produtoController.preview and not empty produtoController.editando.caminhoImagem}" styleClass="preview"/><h:outputText value="#{produtoController.nomePendente}"/></h:panelGroup></div></div><div class="acoes"><p:commandButton value="Salvar" icon="pi pi-check" action="#{produtoController.salvar}" process=":form:cadastro" update=":form:cadastro :form:tabela :form:mensagens"/><p:commandButton value="Novo / cancelar" styleClass="ui-button-secondary" action="#{produtoController.novo}" process="@this" update=":form:cadastro" resetValues="true"/></div></h:panelGroup><div class="painel"><p:commandButton value="Atualizar lista" icon="pi pi-refresh" action="#{produtoController.atualizar}" process="@this" update=":form:tabela :form:mensagens"/><p:dataTable id="tabela" value="#{produtoController.lista}" var="item" rowKey="#{item.id}" paginator="true" rows="10" rowsPerPageTemplate="5,10,20" paginatorPosition="bottom" emptyMessage="Nenhum registro encontrado."><p:column headerText="ID" sortBy="#{item.id}"><h:outputText value="#{item.id}"/></p:column><p:column headerText="Nome" sortBy="#{item.nome}" filterBy="#{item.nome}" filterMatchMode="contains"><h:outputText value="#{item.nome}"/></p:column><p:column headerText="Imagem"><p:graphicImage value="#{request.contextPath}/imagens/#{item.caminhoImagem}" rendered="#{not empty item.caminhoImagem}" styleClass="miniatura"/><h:outputText value="Sem imagem" rendered="#{empty item.caminhoImagem}"/></p:column><p:column headerText="Marca" sortBy="#{item.marca.nome}" filterBy="#{item.marca.nome}" filterMatchMode="contains"><h:outputText value="#{item.marca.nome}"/></p:column><p:column headerText="Categoria" filterBy="#{item.categoria.caminho}" filterMatchMode="contains"><h:outputText value="#{item.categoria.caminho}"/></p:column><p:column headerText="Preço" sortBy="#{item.preco}"><h:outputText value="#{item.preco}"><f:convertNumber type="currency" currencySymbol="R$" locale="pt_BR"/></h:outputText></p:column><p:column headerText="Estoque" sortBy="#{item.quantidadeEstoque}"><h:outputText value="#{item.quantidadeEstoque}"/></p:column><p:column headerText="Ações"><p:commandButton value="Editar" icon="pi pi-pencil" action="#{produtoController.editar(item)}" process="@this" update=":form:cadastro" resetValues="true"/><p:commandButton value="Excluir" icon="pi pi-trash" styleClass="ui-button-danger" action="#{produtoController.excluir(item)}" process="@this" update=":form:tabela :form:mensagens"><p:confirm header="Confirmar exclusão" message="Deseja excluir este registro?" icon="pi pi-exclamation-triangle"/></p:commandButton></p:column></p:dataTable></div></h:form></ui:define></ui:composition>
